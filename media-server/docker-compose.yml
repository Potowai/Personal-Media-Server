version: "3.8"

services:
  jackett:
    container_name: jackett
    image: lscr.io/linuxserver/jackett
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Paris
    volumes:
      - "/home/user/server/configs/jackett:/config"
      - "/home/user/server/torrents:/data/torrents"  # ✅ Matches qBittorrent
    ports:
      - "9117:9117"
    restart: unless-stopped

  sonarr:
    container_name: sonarr
    image: linuxserver/sonarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Paris
    ports:
      - "8989:8989"
    volumes:
      - "/home/user/server/configs/sonarr:/config"
      - "/home/user/server/torrents:/data/torrents"  # ✅ Matches qBittorrent
      - "/home/user/server/media:/data/media"  # ✅ Matches Plex/Jellyfin
    restart: unless-stopped

  radarr:
    container_name: radarr
    image: linuxserver/radarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Paris
    ports:
      - "7878:7878"
    volumes:
      - "/home/user/server/configs/radarr:/config"
      - "/home/user/server/torrents:/data/torrents"  # ✅ Matches qBittorrent
      - "/home/user/server/media:/data/media:rw"  # ✅ Matches Plex/Jellyfin
    restart: unless-stopped

  lidarr:
    container_name: lidarr
    image: ghcr.io/linuxserver/lidarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Paris
    volumes:
      - "/home/user/server/configs/lidarr:/config"
      - "/home/user/server/torrents:/data/torrents"  # ✅ Matches qBittorrent
      - "/home/user/server/media:/data/media"  # ✅ Matches Plex/Jellyfin
    ports:
      - "8686:8686"
    restart: unless-stopped

  bazarr:
    container_name: bazarr
    image: ghcr.io/linuxserver/bazarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Paris
    volumes:
      - "/home/user/server/configs/bazarr:/config"
      - "/home/user/server/media:/data/media"  # ✅ Matches Plex/Jellyfin
    ports:
      - "6767:6767"
    restart: unless-stopped

  plex:
    container_name: plex
    image: ghcr.io/linuxserver/plex
    ports:
      - "32400:32400"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Paris
      - VERSION=docker
    volumes:
      - "/home/user/server/configs/plex:/config"
      - "/home/user/server/media:/data/media"  # ✅ Matches Radarr/Sonarr
    devices:
      - "/dev/dri/renderD128:/dev/dri/renderD128"
      - "/dev/dri/card1:/dev/dri/card1"
    restart: unless-stopped

  jellyfin:
    container_name: jellyfin
    image: ghcr.io/linuxserver/jellyfin
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Paris
    ports:
      - "8096:8096"
    devices:
      - "/dev/dri/renderD128:/dev/dri/renderD128"
      - "/dev/dri/card1:/dev/dri/card1"
    volumes:
      - "/home/user/server/configs/jellyfin:/config"
      - "/home/user/server/media:/data/media"  # ✅ Matches Radarr/Sonarr
    restart: unless-stopped

  overseerr:
    container_name: overseerr
    image: ghcr.io/linuxserver/overseerr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Paris
    volumes:
      - "/home/user/server/configs/overseerr:/config"
    ports:
      - "5055:5055"
    restart: unless-stopped

  qflood:
    container_name: qflood
    image: hotio/qflood
    ports:
      - "8080:8080"
      - "3005:3000"
    environment:
      - PUID=1000
      - PGID=1000
      - UMASK=002
      - TZ=Europe/Paris
      - FLOOD_AUTH=false
    volumes:
      - "/home/user/server/configs/qflood:/config"
      - "/home/user/server/torrents:/data/torrents"  # ✅ Matches Radarr/Sonarr
    restart: unless-stopped

  heimdall:
    container_name: heimdall
    image: ghcr.io/linuxserver/heimdall
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Paris
    volumes:
      - "/home/user/server/configs/heimdall:/config"
    ports:
      - "8090:80"
    restart: unless-stopped

  flaresolverr:
    container_name: flaresolverr
    image: ghcr.io/flaresolverr/flaresolverr:latest
    ports:
      - "8191:8191"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Paris
    restart: unless-stopped
